server {
    listen 80;
    listen [::]:80;
    server_name www.augustinpasquier.fr;

    return 301 https://augustinpasquier.fr$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name augustinpasquier.fr;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 https://augustinpasquier.fr/$is_args$args;
    }
}
